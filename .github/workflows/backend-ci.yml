name: Backend CI

# Only runs when something under services/ or api-gateway/ actually changes.
on:
  push:
    branches: [main, dev]
    paths:
      - 'services/**'
      - 'api-gateway/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'services/**'
      - 'api-gateway/**'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      # One service's failing suite must not cancel the other seven: with
      # fail-fast on, a single red job hides whether the rest would have
      # passed, so a fix has to be guessed at one round trip at a time.
      fail-fast: false
      matrix:
        service_dir:
          - api-gateway
          - services/user-service
          - services/shop-service
          - services/recommendation-service
          - services/navigation-service
          - services/delivery-service
          - services/crowdsource-service
          - services/admin-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ matrix.service_dir }}
        run: pip install -r requirements.txt

      - name: Check the code compiles (syntax check)
        working-directory: ${{ matrix.service_dir }}
        run: find app -name "*.py" -print0 | xargs -0 python -m py_compile

      # The tests that need a database run on in-memory SQLite (see each
      # service's tests/conftest.py), so no service container is needed.
      # JWT_SECRET has no default on purpose, so the suite is given a
      # throwaway one -- the same thing tests/conftest.py does locally.
      #
      # httpx is installed here rather than added to any requirements.txt:
      # fastapi's TestClient needs it, but crowdsource-service does not use
      # it at run time, and a test-only package does not belong in the
      # image that service ships. It is pinned to the version every other
      # service already pins, so CI tests the same client they do.
      #
      # A service with no tests/ directory is skipped rather than failed,
      # so adding a service to the matrix never breaks the build before its
      # first test is written.
      - name: Run the tests
        working-directory: ${{ matrix.service_dir }}
        env:
          JWT_SECRET: ci-only-throwaway-signing-key-0123456789abcdef
        run: |
          if [ ! -d tests ]; then
            echo "No tests/ directory in ${{ matrix.service_dir }} - skipping."
            exit 0
          fi
          pip install pytest==8.3.4 httpx==0.27.2
          python -m pytest tests -q
