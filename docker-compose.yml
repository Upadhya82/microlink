# Production-safe base: only the API gateway is published to the host. Postgres,
# Redis and the seven services talk to each other on the compose network only.
# For local development `docker compose up` also merges docker-compose.override.yml,
# which publishes the extra ports. On a server run:
#   docker compose -f docker-compose.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/user_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  shop-service:
    build: ./services/shop-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/shop_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  recommendation-service:
    build: ./services/recommendation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/recommendation_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      SHOP_SERVICE_URL: http://shop-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      shop-service:
        condition: service_started

  navigation-service:
    build: ./services/navigation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/navigation_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      MAPS_API_KEY: ${MAPS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    build: ./services/delivery-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/delivery_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  crowdsource-service:
    build: ./services/crowdsource-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/crowdsource_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin-service:
    build: ./services/admin-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-microlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/admin_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8000
      SHOP_SERVICE_URL: http://shop-service:8000
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
      NAVIGATION_SERVICE_URL: http://navigation-service:8000
      DELIVERY_SERVICE_URL: http://delivery-service:8000
      CROWDSOURCE_SERVICE_URL: http://crowdsource-service:8000
      ADMIN_SERVICE_URL: http://admin-service:8000
    depends_on:
      - user-service
      - shop-service
      - recommendation-service
      - navigation-service
      - delivery-service
      - crowdsource-service
      - admin-service
    ports:
      - "8080:8080"

volumes:
  pgdata:
